<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --warning: #b45309;
    --warning-bg: #fef3c7;
    --critical: #dc2626;
    --critical-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1d2026;
      --text: #e7e9ec;
      --muted: #9aa1ac;
      --border: #2c3038;
      --ok: #4ade80;
      --ok-bg: #14351f;
      --warning: #fbbf24;
      --warning-bg: #3a2c0c;
      --critical: #f87171;
      --critical-bg: #3a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
  }
  header.page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  header.page-header h1 {
    font-size: 1.4rem;
    margin: 0;
  }
  header.page-header a {
    color: inherit;
    text-decoration: none;
  }
  header.page-header .muted a {
    color: var(--muted);
    text-decoration: underline;
  }
  header.page-header .muted {
    font-size: 0.85rem;
  }
  .muted { color: var(--muted); }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 0.75rem;
  }
  .card h3 {
    font-size: 0.9rem;
    margin: 0.9rem 0 0.4rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .empty-state p { margin: 0.3rem 0; }
  .status-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.2rem;
  }
  .status-header h2 { margin: 0; font-size: 1.15rem; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-ok { color: var(--ok); background: var(--ok-bg); }
  .badge-warning { color: var(--warning); background: var(--warning-bg); }
  .badge-critical { color: var(--critical); background: var(--critical-bg); }
  .timestamp { color: var(--muted); font-size: 0.85rem; margin: 0.2rem 0 0.8rem; }
  .summary { margin: 0 0 0.4rem; line-height: 1.5; }
  .sub-block ul { margin: 0.2rem 0 0; padding-left: 1.2rem; }
  .sub-block li { margin: 0.15rem 0; line-height: 1.4; }
  .check-group { margin-bottom: 0.5rem; }
  table { width: 100%; border-collapse: collapse; }
  .checks-table tr, .history-table tr { border-top: 1px solid var(--border); }
  .checks-table tr:first-child, .history-table tbody tr:first-child { border-top: none; }
  .checks-table td, .history-table td, .history-table th {
    padding: 0.4rem 0.3rem;
    font-size: 0.9rem;
    vertical-align: top;
  }
  .history-table th {
    text-align: left;
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding-bottom: 0.4rem;
  }
  .history-table tbody tr:hover { background: var(--bg); }
  .history-table a {
    color: inherit;
    text-decoration: none;
    display: block;
  }
  .history-table a:hover { text-decoration: underline; }
  .dot-cell { width: 1.2rem; }
  .name-cell { white-space: nowrap; font-weight: 600; width: 1%; padding-right: 0.8rem; }
  .note-cell { color: var(--text); }
  .dot {
    display: inline-block;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
  }
  .dot-ok { background: var(--ok); }
  .dot-warning { background: var(--warning); }
  .dot-critical { background: var(--critical); }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.25rem;
  }
  .chart-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
  }
  .chart-box h3 {
    margin: 0 0 0.6rem;
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
  }
  .chart-box canvas { max-height: 220px; }
</style>
