<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ hostname }} - server health</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --warning: #b45309;
    --warning-bg: #fef3c7;
    --critical: #dc2626;
    --critical-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1d2026;
      --text: #e7e9ec;
      --muted: #9aa1ac;
      --border: #2c3038;
      --ok: #4ade80;
      --ok-bg: #14351f;
      --warning: #fbbf24;
      --warning-bg: #3a2c0c;
      --critical: #f87171;
      --critical-bg: #3a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
  }
  header.page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  header.page-header h1 {
    font-size: 1.4rem;
    margin: 0;
  }
  header.page-header .muted {
    font-size: 0.85rem;
  }
  .muted { color: var(--muted); }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.25rem;
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 0.75rem;
  }
  .card h3 {
    font-size: 0.9rem;
    margin: 0.9rem 0 0.4rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .empty-state p { margin: 0.3rem 0; }
  .status-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.2rem;
  }
  .status-header h2 { margin: 0; font-size: 1.15rem; }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge-ok { color: var(--ok); background: var(--ok-bg); }
  .badge-warning { color: var(--warning); background: var(--warning-bg); }
  .badge-critical { color: var(--critical); background: var(--critical-bg); }
  .timestamp { color: var(--muted); font-size: 0.85rem; margin: 0.2rem 0 0.8rem; }
  .summary { margin: 0 0 0.4rem; line-height: 1.5; }
  .sub-block ul { margin: 0.2rem 0 0; padding-left: 1.2rem; }
  .sub-block li { margin: 0.15rem 0; line-height: 1.4; }
  .check-group { margin-bottom: 0.5rem; }
  table { width: 100%; border-collapse: collapse; }
  .checks-table tr, .history-table tr { border-top: 1px solid var(--border); }
  .checks-table tr:first-child, .history-table tbody tr:first-child { border-top: none; }
  .checks-table td, .history-table td, .history-table th {
    padding: 0.4rem 0.3rem;
    font-size: 0.9rem;
    vertical-align: top;
  }
  .history-table th {
    text-align: left;
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding-bottom: 0.4rem;
  }
  .dot-cell { width: 1.2rem; }
  .name-cell { white-space: nowrap; font-weight: 600; width: 1%; padding-right: 0.8rem; }
  .note-cell { color: var(--text); }
  .dot {
    display: inline-block;
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
  }
  .dot-ok { background: var(--ok); }
  .dot-warning { background: var(--warning); }
  .dot-critical { background: var(--critical); }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.25rem;
  }
  .chart-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
  }
  .chart-box h3 {
    margin: 0 0 0.6rem;
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: none;
    letter-spacing: normal;
  }
  .chart-box canvas { max-height: 220px; }
</style>
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1>{{ hostname }}</h1>
    <span class="muted">server health dashboard - read only</span>
  </header>

  <section class="card" style="padding-top:1rem;padding-bottom:1rem;">
    <h2 style="margin-bottom:0.75rem;">Continuous metrics (last {{ chart_hours }}h)</h2>
    <div class="charts-grid">
      <div class="chart-box"><h3>CPU</h3><canvas id="cpuChart"></canvas></div>
      <div class="chart-box"><h3>Memory</h3><canvas id="memChart"></canvas></div>
      {% for idx in gpu_indices %}
      <div class="chart-box"><h3>GPU {{ idx }} - utilization / VRAM</h3><canvas id="gpu{{ idx }}UtilChart"></canvas></div>
      <div class="chart-box"><h3>GPU {{ idx }} - temperature</h3><canvas id="gpu{{ idx }}TempChart"></canvas></div>
      {% endfor %}
    </div>
  </section>

  <div id="content" hx-get="/fragment" hx-trigger="load, every 30s" hx-swap="innerHTML">
    {% include "_fragment.html" %}
  </div>
</div>

<script>
  const chartHours = {{ chart_hours }};
  const charts = {};

  function makeChart(canvasId, datasetsConfig, yLabel) {
    const ctx = document.getElementById(canvasId);
    if (!ctx) return null;
    return new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: datasetsConfig.map(d => ({
          label: d.label,
          data: [],
          borderColor: d.color,
          backgroundColor: d.color + '2a',
          tension: 0.25,
          pointRadius: 0,
          borderWidth: 1.5,
          fill: datasetsConfig.length === 1,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: yLabel } },
          x: { ticks: { maxTicksLimit: 8 } },
        },
        plugins: { legend: { display: datasetsConfig.length > 1 } },
      },
    });
  }

  charts.cpu = makeChart('cpuChart', [{ label: 'CPU %', color: '#3b82f6' }], '%');
  charts.mem = makeChart('memChart', [{ label: 'Memory %', color: '#8b5cf6' }], '%');
  {% for idx in gpu_indices %}
  charts['gpu{{ idx }}Util'] = makeChart('gpu{{ idx }}UtilChart', [
    { label: 'Utilization %', color: '#10b981' },
    { label: 'VRAM %', color: '#f59e0b' },
  ], '%');
  charts['gpu{{ idx }}Temp'] = makeChart('gpu{{ idx }}TempChart', [{ label: 'Temp °C', color: '#ef4444' }], '°C');
  {% endfor %}

  function updateChart(chart, labels, valueSets) {
    if (!chart) return;
    chart.data.labels = labels;
    chart.data.datasets.forEach((ds, i) => { ds.data = valueSets[i] || []; });
    chart.update('none');
  }

  async function refreshCharts() {
    try {
      const res = await fetch(`/api/metrics?hours=${chartHours}`);
      const data = await res.json();
      updateChart(charts.cpu, data.cpu.labels, [data.cpu.values]);
      updateChart(charts.mem, data.mem.labels, [data.mem.values]);
      for (const [idx, gpu] of Object.entries(data.gpu)) {
        updateChart(charts['gpu' + idx + 'Util'], gpu.util.labels, [gpu.util.values, gpu.mem.values]);
        updateChart(charts['gpu' + idx + 'Temp'], gpu.temp.labels, [gpu.temp.values]);
      }
    } catch (err) {
      console.error('failed to refresh charts', err);
    }
  }

  refreshCharts();
  setInterval(refreshCharts, 30000);
</script>
</body>
</html>
