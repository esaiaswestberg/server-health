services:
  health-check:
    build: .
    container_name: server-health-check
    restart: unless-stopped
    # Every setting is passed as a substitution variable (${VAR:-default})
    # rather than via `env_file: - .env`, so this works the same way
    # whether the values come from a real .env file next to this compose
    # file (plain `docker compose up`) or from a Portainer stack's own
    # "Environment variables" UI, which doesn't create a physical .env
    # file - see the README's "Deploying via Portainer" section.
    environment:
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC to your ntfy topic name}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_NOTIFY_ON_OK: ${NTFY_NOTIFY_ON_OK:-true}
      DB_PATH: ${DB_PATH:-/data/health.db}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 * * * *}
      TZ: ${TZ:-}
      SPEEDTEST_INTERVAL_HOURS: ${SPEEDTEST_INTERVAL_HOURS:-24}
      EXPECTED_DOWNLOAD_MBPS: ${EXPECTED_DOWNLOAD_MBPS:-}
      EXPECTED_UPLOAD_MBPS: ${EXPECTED_UPLOAD_MBPS:-}
      CERT_HOSTS: ${CERT_HOSTS:-}
      CERT_AUTO_DISCOVER_TRAEFIK: ${CERT_AUTO_DISCOVER_TRAEFIK:-true}
      TRAEFIK_DYNAMIC_CONFIG_PATH: ${TRAEFIK_DYNAMIC_CONFIG_PATH:-}
      LOG_LINES_MAX: ${LOG_LINES_MAX:-200}
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-10}
      METRICS_RETENTION_HOURS: ${METRICS_RETENTION_HOURS:-48}
      CPU_WARN_PCT: ${CPU_WARN_PCT:-80}
      CPU_CRIT_PCT: ${CPU_CRIT_PCT:-95}
      MEM_WARN_PCT: ${MEM_WARN_PCT:-85}
      MEM_CRIT_PCT: ${MEM_CRIT_PCT:-95}
      DISK_WARN_PCT: ${DISK_WARN_PCT:-80}
      DISK_CRIT_PCT: ${DISK_CRIT_PCT:-95}
      CPU_TEMP_WARN_C: ${CPU_TEMP_WARN_C:-80}
      CPU_TEMP_CRIT_C: ${CPU_TEMP_CRIT_C:-95}
      GPU_TEMP_WARN_C: ${GPU_TEMP_WARN_C:-80}
      GPU_TEMP_CRIT_C: ${GPU_TEMP_CRIT_C:-90}
      GPU_MEM_WARN_PCT: ${GPU_MEM_WARN_PCT:-85}
      GPU_MEM_CRIT_PCT: ${GPU_MEM_CRIT_PCT:-95}
      CODEX_TIMEOUT_SECONDS: ${CODEX_TIMEOUT_SECONDS:-120}
      WEB_PORT: ${WEB_PORT:-8080}
      DASHBOARD_CHART_HOURS: ${DASHBOARD_CHART_HOURS:-6}
      HISTORY_MAX_RUNS: ${HISTORY_MAX_RUNS:-500}
    cap_add:
      # Needed to chroot into /host/root for read-only host package-manager
      # / systemctl queries (updates.py). Docker grants this by default to
      # root containers anyway; listed explicitly for clarity.
      - SYS_CHROOT
    # Bind-mounting /dev (below) only makes the NVIDIA device nodes
    # *visible* in the container - it does NOT grant permission to actually
    # open() them, which is a separate cgroup-level restriction Docker
    # applies by default. Without this, `nvidia-smi` fails with "Failed to
    # initialize NVML: Unknown Error" even though the device files show up
    # fine under /host/root/dev. 195 is NVIDIA's fixed device major number
    # (covers /dev/nvidiactl and /dev/nvidia0..N); this is the standard
    # narrow fix for GPU device access without pulling in the full NVIDIA
    # Container Toolkit or resorting to `privileged: true`. Delete this
    # block if your server has no GPU.
    device_cgroup_rules:
      - "c 195:* rmw"
    # Routed through Traefik with basic auth, on the network Traefik itself
    # is attached to (TRAEFIK_NETWORK in .env, default "traefik") - no port
    # published on the host, so the *only* way in is through Traefik+auth.
    # See the README's "Web dashboard" section for one-time setup before
    # starting this - in particular, the basicauth.users line below needs
    # your real htpasswd hash edited in directly (NOT via .env - Compose's
    # .env-file interpolation has known bugs with "$"-heavy values passed
    # through into labels like this one, so this is the one place in the
    # whole project that isn't environment-variable-driven).
    labels:
      - traefik.enable=true
      - traefik.http.routers.server-health.rule=Host(`${DASHBOARD_DOMAIN:-health.example.com}`)
      - traefik.http.routers.server-health.middlewares=server-health-auth
      - traefik.http.services.server-health.loadbalancer.server.port=8080
      # Required, not optional: without this, Traefik's HTTPS router muxer
      # doesn't consider this router a TLS candidate at all (even on an
      # already-TLS entrypoint), so requests fall through to Traefik's
      # default 404 instead of ever reaching this service. Confirmed by
      # comparing against a real Traefik instance's dynamic config - every
      # other TLS-routed service there carried a "tls" object; a router
      # without one silently never matches HTTPS requests.
      - traefik.http.routers.server-health.tls=true
      # REPLACE this with your own htpasswd hash - see the README. Every
      # single "$" in the hash htpasswd printed needs to become "$$" here.
      - traefik.http.middlewares.server-health-auth.basicauth.users=admin:$$apr1$$REPLACE$$WITH-YOUR-REAL-HASH
      # These two are genuinely optional - only add them if your other
      # Traefik-routed services set them explicitly too (check their
      # labels/dynamic config to be sure; entrypoints in particular often
      # resolve to a sensible default without being set explicitly):
      # - traefik.http.routers.server-health.entrypoints=websecure
      # - traefik.http.routers.server-health.tls.certresolver=letsencrypt
    #
    # Not using Traefik? Comment out the `labels:` block above and use a
    # published port instead (still no auth of its own - see the README):
    # ports:
    #   - "${WEB_PORT:-8080}:8080"
    volumes:
      # Codex CLI auth (ChatGPT account login). Persisted on the host so the
      # container never has to re-run an interactive login. Codex refreshes
      # tokens in place here.
      - ${CODEX_AUTH_DIR:-~/.codex}:/root/.codex

      # The SQLite database: state, continuous CPU/memory/GPU samples, and
      # run history for the web dashboard. DATA_DIR defaults to ./data for
      # plain `docker compose up`, but set it to an absolute host path if
      # deploying via Portainer - Portainer versions each stack update into
      # its own subfolder, and a relative path here would resolve against
      # that ever-changing folder, silently resetting all history on every
      # update instead of persisting it.
      - ${DATA_DIR:-./data}:/data

      # Real host metrics instead of the container's own cgroup/overlay view.
      - /proc:/host/proc:ro
      - /:/host/root:ro
      # /sys is normally its own mount too (same reasoning as /proc above) -
      # needed to read CPU temperature sensors directly from sysfs
      # (thermal_zone/hwmon). Read-only, just exposes hardware metadata.
      - /sys:/host/root/sys:ro
      # /run is normally its own tmpfs mount, so it doesn't come along with
      # the root bind above - mount it explicitly under /host/root so a
      # `chroot /host/root systemctl --failed` can reach the host's real
      # systemd socket at /run/systemd/private.
      - /run/systemd:/host/root/run/systemd:ro

      # GPU monitoring (app/sampler.py): lets `chroot /host/root nvidia-smi`
      # reach the NVIDIA device nodes. This is the broadest-access mount in
      # this project - it exposes every host device node, not just the GPU.
      # See the README's "a note on the mounts" section before enabling.
      - /dev:/host/root/dev:ro

      # Container status + image update checks. Read-only, but note this is
      # still root-equivalent access to the Docker daemon - see README.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Log scanning uses `chroot /host/root journalctl ...` (the host's own
      # journalctl, read via chroot - see updates.py's docstring for why we
      # chroot instead of installing systemd in this image). /var/log is
      # normally part of the root filesystem so it comes along with the
      # /:/host/root bind above; this is only needed on hosts where
      # /var/log/journal happens to live on its own mount.
      - /var/log/journal:/host/root/var/log/journal:ro

networks:
  default:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
